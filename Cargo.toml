[workspace]
members = ["crates/rng-core", "crates/seed-search-cli", "crates/wasm-search"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
